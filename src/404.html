<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – Govind</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Self-contained: the main page's stylesheet is inlined in index.html, and
       duplicating 2,000 lines here to style one sentence is not worth it. */
    :root {
      --indigo: #1F3A5F;
      --sandstone-text: #A45A34;
      --ivory: #FBF8F3;
      --charcoal: #2B2926;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      background: var(--ivory);
      color: var(--charcoal);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    .code {
      margin: 0 0 8px;
      color: var(--sandstone-text);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--indigo);
      font-family: Lora, Georgia, serif;
      font-size: clamp(1.9rem, 7vw, 3rem);
      line-height: 1.1;
    }

    p {
      max-width: 44ch;
      margin: 0 auto 10px;
      color: rgba(43, 41, 38, 0.75);
    }

    .en { color: rgba(43, 41, 38, 0.5); font-size: 0.94rem; }

    a {
      display: inline-block;
      margin-top: 26px;
      padding: 14px 26px;
      background: var(--indigo);
      color: var(--ivory);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover { background: #162943; }
  </style>
</head>
<body>
  <main>
    <p class="code">Fehler 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Der Link ist vermutlich veraltet oder enthält einen Tippfehler. Zurück zur Startseite finden Sie alles über private Indienreisen mit Govind.</p>
    <p class="en">This page does not exist. The link is probably outdated or mistyped.</p>
    <a href="/">Zur Startseite · Back to the homepage</a>
  </main>
</body>
</html>
